<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrazyTapok | Local Gallery</title>
    <style>
        :root {
            --bg-color: #000000;
            --grid-color: rgba(57, 14, 82, 0.681);
            --accent-color: #a600ff;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: none;
            perspective: 1200px;
        }

        /* --- ФОН --- */
        .grid-container {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 0;
        }

        .glow {
            position: fixed;
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(161, 11, 255, 0.252) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            mix-blend-mode: screen;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, #000 100%);
            z-index: 5;
            pointer-events: none;
        }

        /* --- КУРСОР --- */
        .cursor-dot {
            position: fixed;
            width: 8px; height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-4px, -4px);
            box-shadow: 0 0 15px var(--accent-color);
        }

        .cursor-circle {
            position: fixed;
            width: 40px; height: 40px;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }

        /* --- СЦЕНА --- */
        .scene {
            position: absolute;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .gallery-container {
            position: relative;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
        }

        .card {
            position: absolute;
            top: 50%; left: 50%;
            width: 600px; height: 400px;
            margin-top: -200px; margin-left: -300px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(153, 0, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            backface-visibility: hidden;
            transition: border-color 0.3s;
        }

        .card img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.7);
            transition: all 0.5s ease;
        }

        .card.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 50px rgba(166, 0, 255, 0.399);
            z-index: 100;
        }

        .card.active img {
            filter: grayscale(0%) brightness(1);
        }

        .card-info {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 30px;
            background: linear-gradient(to top, black, transparent);
            transform: translateZ(50px);
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
        }

        .card.active .card-info {
            opacity: 1;
            transform: translateZ(50px) translateY(-10px);
        }

        h2 {
            color: white;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        p {
            color: var(--accent-color);
            margin-top: 10px;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .ui-hint {
            position: fixed;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            letter-spacing: 3px;
            z-index: 20;
            pointer-events: none;
        }
        
        .progress-line {
            position: fixed;
            bottom: 0; left: 0;
            height: 2px;
            background: var(--accent-color);
            width: 0%;
            z-index: 30;
            box-shadow: 0 0 10px var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="grid-container" id="grid"></div>
    <div class="glow" id="glow"></div>
    <div class="vignette"></div>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-circle" id="cursorCircle"></div>

    <div class="progress-line" id="progress"></div>
    <div class="ui-hint">SCROLL / DRAG TO FLY</div>

    <div class="scene">
        <div class="gallery-container" id="gallery"></div>
    </div>

    <script>
        // ==========================================
        // 1. НАСТРОЙКИ: ПУТИ К ТВОИМ ФОТО
        // ==========================================
        const cars = [
            // Пример: если фото лежит в папке img, пиши "img/foto1.jpg"
            // Если фото лежит рядом с html файлом, пиши просто "foto1.jpg"
            
            { title: "C", desc: "Главный вид", img: "img/photo_2026-09-22_21-13-52.jpg" }, 
            
            { title: "R", desc: "Линии кузова", img: "img/photo_2026-09-22_21-13-42.jpg" },
            
            { title: "A", desc: "В движении", img: "img/photo_2026-09-22_21-13-31.jpg" },
            
            { title: "Z", desc: "Закат", img: "img/photo_2026-09-22_21-13-18.jpg" },
            
            { title: "Y", desc: "Поле", img: "img/photo_2026-09-22_21-13-36.jpg" }
        ];
        // ==========================================

        const gallery = document.getElementById('gallery');
        const grid = document.getElementById('grid');
        const glow = document.getElementById('glow');
        const cursorDot = document.getElementById('cursorDot');
        const cursorCircle = document.getElementById('cursorCircle');
        const progress = document.getElementById('progress');

        // Генерация карточек
        cars.forEach((car) => {
            const card = document.createElement('div');
            card.className = 'card';
            // Важно: здесь мы берем путь из переменной car.img
            card.innerHTML = `
                <img src="${car.img}" alt="${car.title}">
                <div class="card-info">
                    <h2>${car.title}</h2>
                    <p>${car.desc}</p>
                </div>
            `;
            gallery.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        
        let scrollPos = 0;
        let targetScroll = 0;
        const maxScroll = cars.length * 1000; 

        // --- УПРАВЛЕНИЕ МЫШЬЮ ---
        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
        });

        document.addEventListener('wheel', e => {
            targetScroll += e.deltaY * 10;
            targetScroll = Math.max(0, Math.min(targetScroll, maxScroll));
        });

        // Драг (свайп) мышкой
        let isDown = false;
        let startX;
        let startScroll;

        document.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX;
            startScroll = targetScroll;
            cursorCircle.style.width = '30px';
            cursorCircle.style.height = '30px';
            cursorCircle.style.background = 'rgba(0, 242, 255, 0.2)';
        });

        document.addEventListener('mouseup', () => {
            isDown = false;
            cursorCircle.style.width = '40px';
            cursorCircle.style.height = '40px';
            cursorCircle.style.background = 'transparent';
        });

        document.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            const x = e.pageX;
            const walk = (x - startX) * 15; 
            targetScroll = startScroll - walk;
            targetScroll = Math.max(0, Math.min(targetScroll, maxScroll));
        });

        // --- АНИМАЦИЯ ---
        function animate() {
            scrollPos += (targetScroll - scrollPos) * 0.08;
            
            const currentLeft = parseFloat(cursorCircle.style.left || 0);
            const currentTop = parseFloat(cursorCircle.style.top || 0);
            
            const nextLeft = currentLeft + (mouseX - currentLeft) * 0.15;
            const nextTop = currentTop + (mouseY - currentTop) * 0.15;

            cursorCircle.style.left = nextLeft + 'px';
            cursorCircle.style.top = nextTop + 'px';
            
            glow.style.left = nextLeft + 'px';
            glow.style.top = nextTop + 'px';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const rotateY = ((mouseX - centerX) / centerX) * 15;
            const rotateX = -((mouseY - centerY) / centerY) * 15;

            grid.style.transform = `translate(-25%, -25%) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.5)`;

            cards.forEach((card, index) => {
                const cardZPos = index * 1000; 
                const relativeZ = cardZPos - scrollPos;

                if (relativeZ < -500 || relativeZ > 2000) {
                    card.style.opacity = 0;
                    return;
                }

                card.style.opacity = 1;
                const scale = 1000 / (1000 + relativeZ); 
                
                const isActive = relativeZ > -100 && relativeZ < 100;
                if(isActive) card.classList.add('active');
                else card.classList.remove('active');

                const tiltX = (mouseY - centerY) * 0.01 * (relativeZ / 1000);
                const tiltY = (mouseX - centerX) * 0.01 * (relativeZ / 1000);

                card.style.transform = `
                    translateZ(${-relativeZ}px) 
                    rotateX(${tiltX}deg) 
                    rotateY(${tiltY}deg)
                    scale(${scale})
                `;
                
                const blur = Math.abs(relativeZ) / 300;
                card.querySelector('img').style.filter = `grayscale(${isActive ? 0 : 100}%) blur(${blur}px)`;
            });

            const percent = (scrollPos / maxScroll) * 100;
            progress.style.width = `${percent}%`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
